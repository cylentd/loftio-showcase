:root{color-scheme:light dark;--foreground:light-dark(#253e34,#e5eee8);--background:light-dark(#faf9f6,#191b1a);--card:light-dark(#edf2eb,#222d27);--secondary:light-dark(#dde7dd,#34473b);--primary:light-dark(#27694c,#9bdbb4);--good:light-dark(#2e9a55,#6fdc95);--muted-foreground:light-dark(#53685b,#afc4b5);--border:light-dark(#bdcdbf,#4d6755);--warning:light-dark(#a55a15,#f6bf73);--danger:light-dark(#b8322a,#ff7b6e);--chip:light-dark(#e2a93f,#ffe0a3);--flash:light-dark(#ffffff,#ffffff);--track:light-dark(#d3ddd3,#17201b);--pending:light-dark(#8e9a92,#e8eee9);--boss-beam:light-dark(#d9b3ff,#6f35c4);--seed:#a8e86f;--seed-glow:#e9ffd0;--beam-fire:#ffc23d;--beam-core:#fff8d6;--slam:light-dark(#8a3fb5,#d6a2ff);--radius:18px;--font-sans:'Trebuchet MS',sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--foreground);font-family:var(--font-sans)}main{display:grid;gap:10px}.roster{display:flex;gap:8px;flex-wrap:wrap}.roster .card{cursor:default}button,.roster .card{font:inherit;color:var(--foreground);border:1px solid var(--border);background:var(--secondary);border-radius:12px;min-height:44px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}button:focus-visible{outline:2px solid var(--primary);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.roster .card{display:flex;align-items:center;gap:6px;flex:1}.roster img{width:32px;height:32px;object-fit:contain}.roster span{display:grid;text-align:left}.roster small{font-size:11px;color:var(--muted-foreground)}
/* --boss-beam (owner, 2026-11-15): the boss Beam warns in purple (living-magic brief, "purple enemy warnings"). It is the
   deep purple beside --slam's light one, at least 3:1 apart in each scheme (WCAG 1.4.11), so lane and ring differ in
   lightness as well as shape. Hero beams stay sky blue in their art. Measured: docs/testing/ui/rumble-boss-lane-purple.
   --beam-fire and --beam-core (2026-11-15): the fired boss beam's amber glow and warm-white core, read from the concept
   (mockups/rumble-living-magic/beam-bidirectional-and-shield.webp, FIRE). Emitted light, so one value in both schemes. */
/* Layout (round 4): one fixed portrait arena, fitted by JS into #stage. Phone portrait first; landscape puts the controls in a side column. */
:root{--perfect:light-dark(#0a8fb0,#7ff0ff);--gap:6px;--pad:10px;--control:40px;--side:300px;--small:12px;--portrait:clamp(58px,calc(var(--col,360px)*.17),100px);--ring:4px;--badge:10px;--glow:16px;--glow-pulse:1.2s;--ping-time:.35s;--fill-alpha:45%;--slow-saturate:.5;--slow-ease:.15s}
/* Round 12: one centred column on every layout. resize() sets --col to the arena's width, so the top bar and dock match it. */
main{height:100svh;margin:0 auto;padding:var(--gap) var(--pad);gap:var(--gap);justify-content:center;grid-template-columns:min(100%,var(--col,640px));grid-template-rows:auto minmax(0,1fr) auto auto;grid-template-areas:"top" "stage" "roster" "hint"}
.top{grid-area:top;display:grid;grid-template-columns:1fr auto auto auto;align-items:center;gap:0 var(--pad)}.top h1{grid-column:1}.top .battle-status{grid-column:1/-1;grid-row:2}h1{font-size:17px;margin:0}
.battle-status{display:flex;flex-wrap:wrap;gap:0 var(--pad);font-size:var(--small);color:var(--muted-foreground)}
.roster{grid-area:roster;gap:var(--gap)}.roster .card{min-height:var(--control);padding:2px var(--gap)}.roster img{width:26px;height:26px}.roster .card{background:linear-gradient(var(--primary),var(--primary)) left bottom/calc(var(--fill,1)*100%) 4px no-repeat,var(--secondary)}.roster small{display:grid}.roster small>span{grid-area:1/1}.roster small>[aria-hidden=true]{visibility:hidden}
#trait{grid-area:trait;margin:0;font-size:var(--small);color:var(--muted-foreground);display:grid}#trait>span{grid-area:1/1}#trait>[aria-hidden=true]{visibility:hidden}
#stage{grid-area:stage;position:relative;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center}
#arena{position:relative;flex:none;overflow:hidden;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);width:0;height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}canvas.held{cursor:grabbing}
/* In-arena DOM text scales with the arena (--k is the logical-to-CSS scale set in resize()). */
.hud{position:absolute;top:calc(16px*var(--k,1));right:calc(14px*var(--k,1));pointer-events:none;font-size:calc(13px*var(--k,1));font-weight:600}
#feedback{position:absolute;bottom:calc(10px*var(--k,1));left:var(--pad);right:var(--pad);text-align:center;pointer-events:none;color:var(--muted-foreground);font-size:calc(14px*var(--k,1))}
.tools{grid-area:tools;display:flex;gap:var(--gap);flex-wrap:wrap}.tools button{min-height:var(--control);padding:var(--gap) var(--pad);flex:1 0 auto;display:inline-grid;place-items:center}.tools button>span{grid-area:1/1;white-space:nowrap}.tools button>[aria-hidden=true]{visibility:hidden}#reroll[hidden]{display:none}#help-toggle{grid-column:4;grid-row:1;justify-self:end;min-height:32px;min-width:var(--control);padding:0 var(--gap);align-self:center}
#help-panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:420px;padding:var(--pad);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);display:grid;gap:var(--gap)}#help-panel[hidden]{display:none}#help,#team-help{margin:0;font-size:13px;color:var(--muted-foreground)}
#portrait-hint{display:none;grid-area:hint;align-items:center;gap:var(--gap);font-size:var(--small);color:var(--muted-foreground)}#portrait-hint button{min-height:32px;padding:2px var(--pad)}
@media (orientation:landscape) and (max-height:500px){#portrait-hint:not([hidden]){display:flex}}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
/* Round 10: arena plus a thumb dock. Each portrait: plain ring, a gold fill rising from the bottom as the special charges (--charge), trait, state. Gold means a special: a pulsing glow and badge when charged; the next fling spends it. */
.top{position:relative}#menu-toggle{grid-column:3;grid-row:1;min-height:32px;min-width:var(--control);padding:0 var(--gap);display:grid;place-items:center}#menu-toggle svg{width:20px;height:20px}#pause{grid-column:2;grid-row:1;min-height:32px;min-width:var(--control);padding:0 var(--gap);display:grid;place-items:center}#pause svg{width:20px;height:20px}
#menu{position:absolute;top:100%;right:0;z-index:3;display:grid;gap:var(--gap);padding:var(--gap);min-width:180px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}#menu[hidden]{display:none}#menu button,#menu a{min-height:var(--control);display:inline-grid;place-items:center}#menu button>span{grid-area:1/1;white-space:nowrap}#menu button>[aria-hidden=true]{visibility:hidden}#menu a{color:var(--primary);font-size:var(--small)}:root:not([data-rumble-demo]) #throw-style{display:grid;gap:var(--gap)}:root:not([data-rumble-demo]) #throw-style .throw-options{display:grid;grid-template-columns:1fr 1fr;gap:var(--gap)}:root:not([data-rumble-demo]) #throw-style button[aria-pressed=true]{border-color:var(--primary);color:var(--primary);font-weight:600}
.roster{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gap)}.roster .card{display:grid;justify-items:center;align-content:start;gap:2px;padding:var(--gap) 2px;min-height:0;background:var(--secondary);text-align:center}.roster .portrait{position:relative;display:grid;place-items:center;width:var(--portrait);height:var(--portrait);border-radius:50%;background:var(--track)}.roster .portrait img{width:calc(100% - var(--ring)*2);height:calc(100% - var(--ring)*2);border-radius:50%;background:var(--card);object-fit:contain}.roster .badge{display:none;position:absolute;top:calc(var(--badge)*-.6);left:50%;transform:translateX(-50%);padding:0 var(--gap);border-radius:var(--badge);background:var(--warning);color:var(--card);font-size:var(--badge);font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}.roster .portrait::after{content:'';position:absolute;inset:var(--ring);border-radius:50%;pointer-events:none;background:linear-gradient(to top,color-mix(in srgb,var(--warning) var(--fill-alpha),transparent) calc(var(--charge,0)*100%),transparent 0)}.roster .badge{z-index:1}.roster b{font-size:clamp(14px,calc(var(--col,360px)*.035),18px)}.roster em{font-style:normal;font-size:var(--small);color:var(--muted-foreground)}.roster small{display:grid;font-size:var(--small)}.roster small>span{grid-area:1/1;text-align:center}.roster small>[aria-hidden=true]{visibility:hidden}
.roster .card.ready{border-color:var(--warning);animation:special-glow var(--glow-pulse) ease-in-out infinite alternate}.roster .card.ready .badge{display:block}
/* Round 16: a ready ping pops the portrait; a resident in a zone about to fire tints its card red. */
.roster .card.ping .portrait{animation:ready-pop var(--ping-time) ease-out}@keyframes ready-pop{40%{transform:scale(1.12)}}
.roster .card.danger{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 22%,var(--secondary))}
@keyframes ready-glow{from{box-shadow:0 0 0 3px var(--primary)}}@keyframes special-glow{from{box-shadow:0 0 0 1px var(--warning)}to{box-shadow:0 0 0 2px var(--warning),0 0 var(--glow) var(--warning)}}
#board{transition:filter var(--slow-ease)}#board.slow{filter:saturate(var(--slow-saturate))}
@media (prefers-reduced-motion:reduce){.roster .card.ping .portrait{animation:ready-glow var(--ping-time) ease-out}.roster .card.ready{animation:none;box-shadow:0 0 0 2px var(--warning),0 0 var(--glow) var(--warning)}#board{transition:none}}

// Words: every player-facing string is a key in rumble-demo-data.js (DEMO.page, read as PAGE and COPY), rumble-cues-data.js or
// drag-feedback-data.js. The markup carries none; WORDS gives each element its words at boot. rumble-copy.test.cjs fails on a new inline string.
const DEMO=window.LoftRumbleDemoData.copy,PAGE=DEMO.page;
const phrase=(template,values)=>template.replace(/\{(\w+)\}/g,(_,key)=>String(values[key]??''));
const WORDS=[['h1','aria-label',PAGE.gameName],['#pause','aria-label',PAGE.pause],['#menu-toggle','aria-label',PAGE.settings],
  ['#help-toggle','aria-label',DEMO.helpMenu],['#health','aria-label',PAGE.bossBar],['#reset','text',PAGE.newBattle],

  ['#portrait-hint span','text',PAGE.portraitHint],['#hint-close','text',PAGE.dismiss]];

for(const [selector,attribute,words] of WORDS){const node=document.querySelector(selector);if(!node)continue;if(attribute==='text')node.textContent=words;else node.setAttribute(attribute,words)}
// All distances/speeds are logical arena units (per second). The arena is a fixed C.arenaW x C.arenaH portrait playfield,
// scaled to fit its container, so ranges and bounce counts are identical on every screen. Prototype feel-test values.
// hp 600 (round 8): with the bounce multiplier, an average-player sim (40 battles per trait) wins in a median 12-13 shots.
const C={arenaW:360,arenaH:640,hudTop:50,hudBottom:32,radius:15,visualSize:46,ringLife:.32,popupLife:.95,enemyRadius:38,hp:600,weakArc:.55,weakMultiplier:3,maxBonusWalls:3,stopSpeed:45,hitCooldown:.22,step:1/180,maxFrame:.04,padding:7,hitReach:47,particleLife:.65,particleCount:12,aimStep:.12,enemyX:.5,enemyY:.3,homeX:.22,homeY:.82,
  weakAngle:Math.PI/2}; // owner 2026-11-18: the weak spot faces the player (was 2.55, lower-left) so its shield shows the carved front art
// Feel tuning, polish pass 2026-11-08. Seconds, CSS px, px/s. Colours are the CSS tokens in :root, named here by key.
const GUARD=window.LoftRumbleBossFightData.guard,GUARD_RULES=window.LoftRumbleBossFightModel; // the shield's rules (owner 2026-11-18)
const FEEL={
 // Glide (rounds 3-4): every shot flies at full trait speed until its travel budget (trait range, units of path) is partly
 // spent, then rolls to rest over the last glideEase share with a power-glideCurve ease-out (2 quadratic, 3 cubic).
 glideEase:.35,glideCurve:3,           // owner 2026-11-08: the 13% constant-deceleration stop felt abrupt
 enemyBudgetCost:1,                    // an enemy bounce costs (1 - trait bounce) x range x this of the remaining budget
 overdriveRange:1.3,                   // Overdrive multiplies the travel budget by this (speed by A.overdrive)
 wallSquash:.3,wallSquashLife:.16,     // sprite squash against the wall normal on each bounce
 wallSparks:7,wallSparkSpeed:190,wallSparkSpread:1.2, // spark fan per wall hit: count, px/s, radians
 counterPop:.22,                       // bounce counter pop after each wall
 cancelRadius:30,                      // minimum pull: shorter drags cancel, so a stray touch never fires; past it the shot is armed
 aimSegments:24,                       // trace() walks the whole budget, up to this many wall or enemy bounces
 // Aim guide (round 5, owner: the round-0 straight dotted line "felt more natural"): aimDots dots every aimGap units
 // from the resident's edge, so the guide is aimDots x aimGap = 280 units long (round 6: 1.7x for a non-gamer); one wall reflection, ends at the enemy.
 aimDots:20,aimGap:14,aimDot:2.8,aimFade:.7, // dot count, spacing, dot radius, opacity lost by the tip dot
 bandAlpha:.5,                         // rubber band from press point to finger
 powerRing:7,armedAlpha:.6,            // armed ring distance outside the resident ring, and its opacity (timing off only)
 artFill:1.35,                         // sprite drawn at visualSize x this, so the body (the art has ~22% transparent margin) fills its ring
 artBalance:{chomper:.94},              // per-resident art scale so all three read the same size at rest: Chomper's art covers 0.453 of its frame vs Sprout 0.404 and Puff 0.390 (alpha > 40, 2026-11-15); sqrt(0.397/0.453) = .94. Others 1
 bulletTime:false,                     // round 11: slow-mo while aiming (RT.slowFactor, Focus) is off; owner: "too good, and it wouldn't make sense in PvP". Kept for a charm or special.
 // Timing gauge (round 5, Monster Strike's gauge shot; back in round 11): sweeps 0->1->0 each gaugeCycle seconds while a pulled aim is held.
 // Release within greatHalf of gaugeCenter = Great, within perfectHalf = Perfect. Elsewhere is a normal shot, no penalty.
 // Round 15 (owner: the gauge made every shot anxious): it fades in only after gaugeDelay of holding a pulled aim; a quicker release is a normal shot.
 gaugeDelay:.3,gaugeFade:.15,          // seconds of held pull before the sweep starts, and its fade-in

 gaugeGap:6,gaugeWidth:5,              // ring offset outside the aim start, stroke width

 perfectPulse:.16,perfectPulseLife:.14, // resident scale bump on entering Perfect, and its decay (s); skipped under reduced motion
 perfectVibrate:8,                     // haptic tick (ms) on entering Perfect, where vibration is supported
 // Round 13 special-ready cue: the resident ring turns thick gold and breathes; a star badge sits top-right. No orbiting sparkles.
 auraBreath:2,auraAlphaMin:.45,auraAlphaMax:1, // breath period (s) and ring opacity range; reduced motion holds auraAlphaMax
 // Special charge (owner: a growing bar read as the cooldown): damage the resident deals fills it; the dock portrait fills with gold. No time charge.
 // specialCharge 280 (round 17, HP 2800): a 40-battle rotating bot sim gives 2.4 specials per resident per battle.
 // Round 16 experiment (owner: "Should there even be a cooldown?"): recharge off means a resident flings again the moment it stops; travel time is the cooldown.
 // Round 17 hit combo: every enemy hit adds one, whoever lands it. A Beam or Slam catching a resident ends it (Pulse is unavoidable, so it never does),
 // and so does comboTimeout s with no enemy hit (a gentle idle reset, no visible timer). Reward is special charge rate, never damage:

 comboTimeout:4,comboCharge:.02,comboChargeCap:.6,comboMilestones:[10,25,50],

 // Round 19 bumpers: two fixed round posts (arena fractions) flanking the lane under the enemy, so a fling from the bottom ricochets into it.

 bumpers:[[.3,.5],[.7,.5]],bumperRadius:16,bumperRange:.15,bumperLine:3,bumperCore:.4,
 bumperFlash:.25,bumperSquash:.25,bumperPing:.4,bumperPingGrow:24,bumperVibrate:12, // flash (s), squash at the hit, ping ring life (s) and growth, haptic (ms)

 // Reduced motion: no slow-mo, no zoom, no pop growth: the burst and a fade.
 finaleSlow:.2,finaleTime:1.2,finaleZoom:.15,finaleZoomIn:.35,finalePop:.35,finaleSparks:28,finaleSparkSpeed:320,finaleShards:14,finaleShardSpeed:150,finaleShardSize:6,finaleShake:10,finaleVibrate:60,
