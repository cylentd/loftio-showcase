<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Loftio</title>
  </head>
  <body>
    <main class="builder">
      <header>
        <a href="./index.html" data-copy="back"></a>
        <h1 data-copy="title"></h1>
        <p data-copy="intro"></p>
        <p class="notice" data-copy="mockNotice"></p>
      </header>
      <div class="workbench">
        <form id="builder-form">
          <fieldset id="selections">
            <label for="creature" data-copy="creature"></label>
            <select id="creature" name="creature"></select>
            <label for="personality" data-copy="personality"></label>
            <select id="personality" name="personality"></select>
            <label for="signatureDetail" data-copy="signatureDetail"></label>
            <select id="signatureDetail" name="signatureDetail"></select>
            <label for="palette" data-copy="palette"></label>
            <select id="palette" name="palette"></select>
          </fieldset>
          <div class="actions">
            <button id="create" type="submit" class="primary" data-copy="create"></button>
            <button id="cancel" type="button" data-copy="cancel" hidden></button>
          </div>
          <p id="usage" class="muted"></p>
        </form>
        <section class="reveal" aria-label="Preview">
          <div class="preview" id="preview">
            <p id="preview-empty" data-copy="empty"></p>
            <img id="preview-image" alt="" hidden />
          </div>
          <p id="resolved" class="resolved"></p>
          <p id="image-check" class="muted"></p>
          <div id="reveal-actions" class="actions" hidden>
            <button type="button" id="keep" class="primary" data-copy="keep"></button>
            <button type="button" id="another" data-copy="another"></button>
            <button type="button" disabled data-copy="refine" aria-describedby="refine-reason"></button>
          </div>
          <p id="refine-reason" class="muted" data-copy="refineUnavailable"></p>
        </section>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <p id="error" role="alert" hidden></p>
      <section class="saved" aria-labelledby="gallery-title">
        <h2 id="gallery-title" data-copy="gallery"></h2>
        <p id="gallery-empty" class="muted" data-copy="galleryEmpty"></p>
        <ul id="gallery"></ul>
        <p class="muted" data-copy="storageNotice"></p>
      </section>
    </main>
    <script type="module" src="../src/builder/page.ts"></script>
  </body>
</html>
